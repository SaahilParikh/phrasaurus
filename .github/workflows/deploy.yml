name: deploy

on:
  push:
    branches: [main]
    paths: ['backend/**', 'frontend/src/**', '.github/workflows/deploy.yml']
  workflow_dispatch: # allow manual redeploys

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  DEPLOY_ROLE_ARN: arn:aws:iam::534886060250:role/phrasaurus-github-deploy
  LAMBDA_FUNCTION_NAME: phrasaurus-lambda
  LAMBDA_HANDLER: phrasaurus.handler.lambda_handler
  LAMBDA_TIMEOUT: '15'
  FRONTEND_BUCKET: phrasaurus.com

jobs:
  backend:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(toJSON(github.event.commits.*.modified), 'backend/') ||
      contains(toJSON(github.event.commits.*.added), 'backend/') ||
      contains(toJSON(github.event.commits.*.removed), 'backend/')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        working-directory: backend
        run: python -m pytest

      - name: Build deployment zip
        run: |
          mkdir -p backend/build/pkg
          cp -R backend/src/phrasaurus backend/build/pkg/phrasaurus
          cd backend/build/pkg && zip -rq ../phrasaurus-lambda.zip . -x "*.pyc" "__pycache__/*"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update Lambda code
        run: |
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --zip-file fileb://backend/build/phrasaurus-lambda.zip \
            --no-cli-pager
          aws lambda wait function-updated --function-name "$LAMBDA_FUNCTION_NAME"

      - name: Enforce desired Lambda configuration
        run: |
          aws lambda update-function-configuration \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --handler "$LAMBDA_HANDLER" \
            --timeout "$LAMBDA_TIMEOUT" \
            --no-cli-pager
          aws lambda wait function-updated --function-name "$LAMBDA_FUNCTION_NAME"

      - name: Resolve Function URL
        id: url
        run: |
          url=$(aws lambda get-function-url-config \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --query FunctionUrl --output text)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: python scripts/smoke-test.py "${{ steps.url.outputs.url }}"

  frontend:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(toJSON(github.event.commits.*.modified), 'frontend/src/') ||
      contains(toJSON(github.event.commits.*.added), 'frontend/src/') ||
      contains(toJSON(github.event.commits.*.removed), 'frontend/src/')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm test

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync frontend to S3
        run: |
          aws s3 sync frontend/src "s3://${FRONTEND_BUCKET}/" \
            --delete \
            --cache-control "public, max-age=300"
