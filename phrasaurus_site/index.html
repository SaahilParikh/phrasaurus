<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phrasaurus</title>
    <link href="https://fonts.googleapis.com/css2?family=Dosis:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* [CSS remains largely unchanged. Only redundant styles removed.] */
        body {
            background-color: #77DD77;
            color: #FFFFFF; /* General Text Color */
            font-family: 'Dosis', sans-serif;
        }

        p {
            font-size: 2em;
        }

        textarea {
            height: fit-content;
            word-wrap: break-word;
            resize: none;
            overflow: hidden;
            max-width: 100%;
        }

        #input {
            height: 75px;
            background-color: #48bf31;
            font-size: 3em;
            font-weight: bold;
            color: #FFFFFF;
            border: none;
            border-radius: 5px;
        }

        /* For WebKit browsers like Safari and older versions of Chrome */
.input-box::-webkit-input-placeholder {
    opacity: 100%;
}

/* For Firefox 19+ */
.input-box::-moz-placeholder {
    opacity: 100%;
}

/* For Firefox 18- */
.input-box:-moz-placeholder {
    opacity: 100%;
}

/* For Internet Explorer 10-11 */
.input-box:-ms-input-placeholder {
    opacity: 100%;
}

/* For most modern browsers including newer versions of Chrome, Firefox, and Edge */
.input-box::placeholder {
    opacity: 100%;
}


        #outputPhrase {
            white-space: normal; /* Allows text to wrap */
            overflow-wrap: break-word; /* Breaks the word in case of long unbreakable strings (like URLs) */
            overflow-x: auto; /* Shows a scrollbar if content overflows horizontally */
        }

        .button {
            background-color: #FF964F;
            color: #FFFFFF;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 1.2em;
            transition: background-color 0.3s ease;
        }

        .button:hover {
            color: #f8dfc8;
            background-color: #EE9070;
        }

        .button:active {
            background-color: #E47A50;
        }

        .highlight {
            background-color: #FFDAB9;
            padding: 2px 5px;
            border-radius: 3px;
        }

        @media (max-width: 576px) {

            .button {
                width: 95%;        /* Sets the width of the button to 95% on small screens */
                margin: 0 auto;    /* Centers the button */
                display: block;    /* Makes the button block-level so it takes up the full width */
            }

            textarea {
                font-size: 1.5em;
            }

            p {
             font-size: 1em; /* adjust as required */
            }

            .input-box {
                width: 100%;
                height: auto; /* adjusts height automatically */
                margin-bottom: 10px;
                padding: 10px; /* add padding for better appearance */
            }

            .d-flex {
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }
        }

        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }

        .typewriter {
            display: inline-block;
            overflow: hidden;
            border-right: .15em solid #FFFFFF;
            white-space: nowrap;
            animation: blink .5s step-end infinite alternate;
        }

        @keyframes blink {
            from, to { border-color: transparent }
            50% { border-color: #FFFFFF; }  /* Matches your text color */
        }

    </style>
</head>

<body>
    <main class="container d-flex flex-column justify-content-center" style="height: 100vh;">
        <div class="text-center">
            <div class="d-flex justify-content-center mt-4 mid-wrapper">
                <textarea oninput="autogrow(this)" id="input" class="input-box" maxlength="100" placeholder=""></textarea>
                <button class="button ml-2" onclick="generateSynonym()" id="searchButton">
                    <span id="buttonText">➤</span>
                    <div class="spinner-grow spinner-grow-sm d-none" id="loadingSpinner" role="status">
                        <span class="sr-only">Loading...</span>
                    </div>
                </button>                
            </div>
            <p class="output-phrase mt-4 typewriter" id="outputPhrase" onclick="copyToClipboard()" title="Click to copy"></p>              
        </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
        document.querySelector('#input').addEventListener('keydown', function(event) {
            if (event.key === "Enter") {
                event.preventDefault();  // Prevent the default behavior (new line in textarea)
                generateSynonym();
            }
        });

        // Create more chances for the phrase 'A minimalistic thesaurus for phrases'
        const stringList = ["A minimalistic thesaurus for phrases", "A minimalistic thesaurus for phrases", "A minimalistic thesaurus for phrases", "A minimalistic thesaurus for phrases", "A minimalistic thesaurus for phrases", "A phrase synonym repository", "Phrase equivalent compendium", "A dinosaur that eats phrases"];

        function getRandomString() {
            const randomIndex = Math.floor(Math.random() * stringList.length);
            return stringList[randomIndex];
        }

        function typeText(element, text, index) {
            if (index < text.length) {
                if (element.tagName === 'TEXTAREA') {
                    element.placeholder += text.charAt(index);
                } else {
                    element.textContent += text.charAt(index);
                }
                setTimeout(() => typeText(element, text, index + 1), 10);
            }
        }

        function fillInputBox() {
            const inputElement = document.getElementById('input');
            inputElement.placeholder = "";  // Clear out the existing placeholder
            typeText(inputElement, "Phrasaurus", 0);
        }

        function fillPhrasaurus() {
            const outputElement = document.getElementById('outputPhrase');
            outputElement.textContent = "";  // Clear out the existing text content
            typeText(outputElement, getRandomString(), 0);
        }


        function generateSynonym() {
            const outputElement = document.getElementById('outputPhrase');
            const searchButton = document.getElementById('searchButton');
            const buttonText = document.getElementById('buttonText');
            const loadingSpinner = document.getElementById('loadingSpinner');

            outputElement.textContent = "";  // Clear out the existing text content

            const inputPhrase = document.querySelector('#input').value.trim();

            // Disable the button and show the spinner
            searchButton.disabled = true;
            buttonText.style.display = 'none';
            loadingSpinner.classList.remove('d-none');

            if (!inputPhrase) {

                // Hide spinner and enable the button
                searchButton.disabled = false;
                buttonText.style.display = '';
                loadingSpinner.classList.add('d-none');

                return fillPhrasaurus();
            }

            fetch('https://phrasaurus.com/api/v1', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ phrase: inputPhrase })
            })
            .then(response => response.json())
            .then(data => {

                const output = data.synonym || "Sorry, no synonym found!";
                outputElement.textContent = "";  // Clear out the existing text content
                typeText(outputElement, output, 0);

                // Hide spinner and enable the button
                searchButton.disabled = false;
                buttonText.style.display = '';
                loadingSpinner.classList.add('d-none');
            })
            .catch(error => {
                console.error("Error fetching synonym:", error);
                outputElement.textContent = 'Error fetching synonym!';

                // Hide spinner and enable the button even in case of an error
                searchButton.disabled = false;
                buttonText.style.display = '';
                loadingSpinner.classList.add('d-none');
            });
        }


        function autogrow(elm) {
            // Set the height to a small value temporarily to reset the scroll height
            elm.style.height = '5px';

            // Set the new height based on the scrollHeight
            elm.style.height = (elm.scrollHeight) + "px";
        }

        function copyToClipboard() {
            const outputText = document.getElementById('outputPhrase').textContent;

            const selection = window.getSelection();
            const range = document.createRange();

            range.selectNodeContents(outputPhrase); // Select the text of the outputPhrase element
            selection.removeAllRanges();            // Clear any existing selections
            selection.addRange(range);              // Add the new range to the selection

            try {
                document.execCommand('copy');       // Copy the selected content
                selection.removeAllRanges();        // Clear the selection after copying
            } catch (err) {
                console.error('Unable to copy text', err);
            }
        }


        window.onload = function() {
            fillInputBox();
            fillPhrasaurus();
        }
    </script>
</body>

</html>
