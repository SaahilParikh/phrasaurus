# Build + tooling config for the phrasaurus Lambda backend.
# Runtime deps live in requirements.txt. Dev/test tools live here.

[project]
name = "phrasaurus-backend"
version = "0.3.0"
description = "AWS Lambda backend for phrasaurus — phrase-to-phrase thesaurus powered by Amazon Bedrock."
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "phrasaurus contributors" }]

# Runtime dependency — the Lambda runtime provides boto3, but we still
# declare it so local development + tests work. Mirror in requirements.txt.
dependencies = [
  "boto3>=1.34.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6.0",
  "mypy>=1.10",
]

# ---------------------------------------------------------------------------
# Ruff — linter + formatter.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
  "E501", # line-length — formatter handles this
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B018"] # allow useless expressions (asserts that look like no-ops)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Mypy.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

# boto3's runtime API accepts flexible dict shapes that don't round-trip
# cleanly through static TypedDicts. We opt out of strict typing on AWS
# clients; the code is exercised via the test suite instead.
[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true
follow_imports = "skip"

# ---------------------------------------------------------------------------
# Pytest.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "-q",
]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/phrasaurus"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
