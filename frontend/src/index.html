<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phrasaurus — a minimalistic thesaurus for phrases</title>
    <meta
      name="description"
      content="Type a phrase. Get a synonymous phrase back. Powered by an LLM."
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Dosis:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body>
    <main class="app">
      <div class="stack">
        <form id="query-form" class="query" novalidate>
          <label for="phrase-input" class="visually-hidden">Enter a phrase</label>
          <textarea
            id="phrase-input"
            class="phrase-input"
            maxlength="280"
            rows="1"
            autocomplete="off"
            spellcheck="true"
            aria-describedby="phrase-help"
          ></textarea>
          <span id="phrase-help" class="visually-hidden">
            Enter a word or phrase; press Enter or the arrow button to see a synonymous phrase.
          </span>
          <button id="submit-button" class="button" type="submit" aria-label="Get synonym">
            <span id="button-text" aria-hidden="true">➤</span>
            <span id="loading-spinner" class="spinner hidden" role="status" aria-live="polite">
              <span class="visually-hidden">Loading…</span>
            </span>
          </button>
        </form>

        <p
          id="output-phrase"
          class="output-phrase hidden"
          tabindex="0"
          role="button"
          title="Click to copy"
          aria-label="Synonym result. Click to copy to clipboard."
        ></p>
      </div>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
